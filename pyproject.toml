[project]
name = "config-cli"
version = "0.1.0"
description = "配置文件驱动的 DeepSeek 命令行助手"
readme = "README.md"
authors = [
    { name = "chillydusk", email = "mjh050728@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
config-cli = "config_cli:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
